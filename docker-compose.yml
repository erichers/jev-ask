services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: jevask
      MYSQL_DATABASE: jevask
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pjevask"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - jev-mysql:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PARSER_PROVIDER: rule
      DATABASE_PROVIDER: mysql
      MYSQL_CONNECTION: Server=mysql;Port=3306;Database=jevask;User=root;Password=jevask;
      Data__SamplePath: /app/data/samples
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  jev-mysql:
